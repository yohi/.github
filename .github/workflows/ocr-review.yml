name: OpenCodeReview (Reusable)

on:
  workflow_call:
    inputs:
      base-ref:
        description: "レビュー対象のベースブランチ (省略時は github.base_ref)"
        required: false
        type: string
      head-ref:
        description: "レビュー対象のヘッドブランチ (省略時は github.head_ref)"
        required: false
        type: string
      pr-number:
        description: "コメント投稿先の PR 番号"
        required: false
        type: string
      pr-title:
        description: "背景コンテキストとして使う PR タイトル"
        required: false
        type: string
        default: ""
      concurrency:
        description: "OCR の並列サブエージェント数"
        required: false
        type: number
        default: 5
      ocr-version:
        description: "@alibaba-group/open-code-review のバージョン"
        required: false
        type: string
        default: "latest"
      tooling-ref:
        description: "yohi/.github 側のスクリプト取得に使う git ref"
        required: false
        type: string
        default: "master"
    secrets:
      OCR_LLM_URL:
        required: true
      OCR_LLM_AUTH_TOKEN:
        required: true
      OCR_LLM_MODEL:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ocr-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCodeReview
        run: npm install -g @alibaba-group/open-code-review@${{ inputs.ocr-version }}

      - name: Configure OCR
        run: |
          ocr config set llm.url "${{ secrets.OCR_LLM_URL }}"
          ocr config set llm.auth_token "${{ secrets.OCR_LLM_AUTH_TOKEN }}"
          ocr config set llm.model "${{ secrets.OCR_LLM_MODEL }}"
          ocr config set llm.use_anthropic "${{ vars.OCR_LLM_USE_ANTHROPIC || 'false' }}"
          ocr config set llm.extra_body '{"thinking": {"type": "disabled"}}'

      - name: Run OCR review
        env:
          PR_TITLE: ${{ inputs.pr-title || github.event.pull_request.title }}
          BASE_REF: ${{ inputs.base-ref || github.base_ref }}
          HEAD_REF: ${{ inputs.head-ref || github.head_ref }}
        run: |
          ocr review \
            --background "PR: ${PR_TITLE}" \
            --from "origin/${BASE_REF}" \
            --to "origin/${HEAD_REF}" \
            --format json \
            --audience agent \
            --concurrency ${{ inputs.concurrency }} \
            > /tmp/ocr-result.json 2> /tmp/ocr-stderr.log

      - name: Fetch comment poster script
        if: always()
        run: |
          curl -fsSL -o /tmp/post-ocr-comments.js \
            "https://raw.githubusercontent.com/yohi/.github/${{ inputs.tooling-ref }}/.github/workflows/scripts/post-ocr-comments.js"

      - name: Post review comments
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node /tmp/post-ocr-comments.js \
            --repo "${{ github.repository }}" \
            --pr "${{ inputs.pr-number || github.event.pull_request.number }}" \
            --result "/tmp/ocr-result.json"

      - name: Upload result artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-debug-logs
          path: |
            /tmp/ocr-result.json
            /tmp/ocr-stderr.log
          if-no-files-found: ignore
