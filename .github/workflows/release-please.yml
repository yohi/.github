name: Reusable Release Please

on:
  workflow_call:
    inputs:
      release-type:
        description: 'Type of release (e.g., node, python, go, rust)'
        required: false
        type: string
        default: 'node'
      package-name:
        description: 'Name of the package'
        required: false
        type: string
        default: ''
    secrets:
      token:
        description: 'GitHub token to use for release creation'
        required: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          release-type: ${{ inputs.release-type }}
          package-name: ${{ inputs.package-name }}
          token: ${{ secrets.token || github.token }}
